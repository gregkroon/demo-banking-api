template:
  name: cd-governed-template
  identifier: cd_governed_template
  versionLabel: "1.0"
  type: Pipeline
  projectIdentifier: claude
  orgIdentifier: default
  description: "Governed CD pipeline with change-window enforcement and production approval gate"
  tags:
    demo: "true"
    team: platform
  spec:
    stages:
      - stage:
          name: Deploy to Dev
          identifier: deploy_dev
          type: Deployment
          spec:
            deploymentType: Kubernetes
            service:
              serviceRef: demo_banking_api
              serviceInputs:
                serviceDefinition:
                  type: Kubernetes
                  spec:
                    artifacts:
                      primary:
                        primaryArtifactRef: primary
                        sources:
                          - identifier: primary
                            type: DockerRegistry
                            spec:
                              tag: <+pipeline.variables.IMAGE_TAG>
            environment:
              environmentRef: dev
              deployToAll: false
              infrastructureDefinitions:
                - identifier: dev_k8s
            execution:
              steps:
                - step:
                    type: K8sRollingDeploy
                    name: Rolling Deploy Dev
                    identifier: rolling_deploy_dev
                    spec:
                      skipDryRun: false
                      pruningEnabled: false

                - step:
                    type: Run
                    name: Smoke Test Dev
                    identifier: smoke_test_dev
                    spec:
                      connectorRef: account.harnessImage
                      image: curlimages/curl:latest
                      shell: Sh
                      command: |
                        echo "Running smoke test against dev environment..."
                        # In real demo: curl http://demo-banking-api.banking-dev/health
                        echo '{"status":"ok","version":"1.0.0"}' | grep -q '"status":"ok"'
                        echo "Smoke test PASSED"

              rollbackSteps:
                - step:
                    type: K8sRollingRollback
                    name: Rollback Dev
                    identifier: rollback_dev
                    spec: {}

      - stage:
          name: Production Approval
          identifier: production_approval
          type: Approval
          spec:
            execution:
              steps:
                - step:
                    type: HarnessApproval
                    name: Approve Production Deployment
                    identifier: approve_production
                    spec:
                      approvalMessage: |
                        ## Production Deployment Approval

                        **Service:** demo-banking-api
                        **Image Tag:** <+pipeline.variables.IMAGE_TAG>
                        **Dev smoke tests:** PASSED

                        Please review the dev deployment and approve to proceed to production.
                        This deployment is subject to the change-window policy (Mon-Fri 08:00-17:00 AEST).
                      includePipelineExecutionHistory: true
                      isAutoRejectEnabled: false
                      approvers:
                        minimumCount: 1
                        disallowPipelineExecutor: true
                        userGroups:
                          - account._account_all_users
                      approverInputs:
                        - name: Change Ticket
                          defaultValue: ""

      - stage:
          name: Deploy to Production
          identifier: deploy_production
          type: Deployment
          spec:
            deploymentType: Kubernetes
            service:
              serviceRef: demo_banking_api
              serviceInputs:
                serviceDefinition:
                  type: Kubernetes
                  spec:
                    artifacts:
                      primary:
                        primaryArtifactRef: primary
                        sources:
                          - identifier: primary
                            type: DockerRegistry
                            spec:
                              tag: <+pipeline.variables.IMAGE_TAG>
            environment:
              environmentRef: production
              deployToAll: false
              infrastructureDefinitions:
                - identifier: prod_k8s
            execution:
              steps:
                - step:
                    type: K8sRollingDeploy
                    name: Rolling Deploy Production
                    identifier: rolling_deploy_prod
                    spec:
                      skipDryRun: false
                      pruningEnabled: false

                - step:
                    type: Run
                    name: Post-Deploy Verification
                    identifier: post_deploy_verify
                    spec:
                      connectorRef: account.harnessImage
                      image: curlimages/curl:latest
                      shell: Sh
                      command: |
                        echo "Running post-deployment verification in production..."
                        echo '{"status":"ok","version":"1.0.0"}' | grep -q '"status":"ok"'
                        echo "Production deployment VERIFIED"

              rollbackSteps:
                - step:
                    type: K8sRollingRollback
                    name: Rollback Production
                    identifier: rollback_production
                    spec: {}

  variables:
    - name: IMAGE_REPO
      type: String
      description: "Docker image repository name"
      required: true
      value: <+input>
    - name: IMAGE_TAG
      type: String
      description: "Docker image tag to deploy"
      required: true
      value: <+input>
