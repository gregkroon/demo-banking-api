name: GitHub CI to Harness SCS

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-attest:
    name: Build, Test, SBOM and SLSA
    runs-on: ubuntu-latest

    # ==========================================================
    # TEMPORARY HASHICORP VAULT
    #
    # This Vault exists only for this GitHub Actions job.
    # Fine for our POC.
    # ==========================================================
    services:
      vault:
        image: hashicorp/vault:1.21
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK

    # ==========================================================
    # GLOBAL ENVIRONMENT
    #
    # IMPORTANT:
    # DOCKER_USERNAME/PASSWORD are exported here because the
    # Harness actions run inside their own Docker containers
    # and need registry credentials when pushing attestations.
    # ==========================================================
    env:
      IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/demo-banking-api
      IMAGE_TAG: ${{ github.sha }}

      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      # Harness Docker actions need to reach the Vault
      # service container by its service name.
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ========================================================
      # 2. TEST
      #
      # demo-banking-api appears to be Python based.
      # Change these steps if your app uses something else.
      # ========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q

      # ========================================================
      # 3. CONFIGURE TEMPORARY VAULT
      #
      # Shell commands run on the GitHub runner itself,
      # therefore use localhost here.
      # ========================================================
      - name: Wait for Vault
        env:
          VAULT_ADDR: http://127.0.0.1:8200
        run: |
          echo "Waiting for Vault..."

          for i in {1..30}; do
            if curl --silent \
              --output /dev/null \
              "${VAULT_ADDR}/v1/sys/health"; then
              echo "Vault is ready"
              exit 0
            fi

            sleep 2
          done

          echo "Vault did not start"
          exit 1

      # ========================================================
      # 4. ENABLE VAULT TRANSIT ENGINE
      # ========================================================
      - name: Enable Vault Transit engine
        env:
          VAULT_ADDR: http://127.0.0.1:8200
        run: |
          curl --fail \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            --header "Content-Type: application/json" \
            --request POST \
            --data '{"type":"transit"}' \
            "${VAULT_ADDR}/v1/sys/mounts/transit"

          echo "Vault Transit engine enabled"

      # ========================================================
      # 5. CREATE COSIGN-COMPATIBLE ECDSA P-256 KEY
      #
      # Creates:
      #
      # transit/keys/cosign
      #
      # Private key material never leaves Vault.
      # ========================================================
      - name: Create Cosign signing key
        env:
          VAULT_ADDR: http://127.0.0.1:8200
        run: |
          curl --fail \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            --header "Content-Type: application/json" \
            --request POST \
            --data '{"type":"ecdsa-p256"}' \
            "${VAULT_ADDR}/v1/transit/keys/cosign"

          echo "Created Vault signing key: cosign"

      # ========================================================
      # 6. VERIFY VAULT KEY EXISTS
      # ========================================================
      - name: Verify signing key
        env:
          VAULT_ADDR: http://127.0.0.1:8200
        run: |
          curl --fail \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ADDR}/v1/transit/keys/cosign" \
            > /tmp/cosign-key.json

          echo "Vault signing key verified"

      # ========================================================
      # 7. LOGIN TO DOCKER HUB
      # ========================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ========================================================
      # 8. SET UP BUILDX
      # ========================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # 9. BUILD + PUSH IMAGE
      #
      # Git commit SHA becomes image tag.
      #
      # Example:
      #
      # munkys123/demo-banking-api:
      # 614464bb6d0ab837...
      # ========================================================
      - name: Build and push image
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # ========================================================
      # 10. CAPTURE IMMUTABLE IMAGE DIGEST
      #
      # This becomes our primary chain-of-custody identifier.
      # ========================================================
      - name: Record artifact identity
        run: |
          echo "IMAGE_DIGEST=${{ steps.docker-build.outputs.digest }}" \
            >> "$GITHUB_ENV"

          echo "IMAGE_DIGEST_REF=${IMAGE_NAME}@${{ steps.docker-build.outputs.digest }}" \
            >> "$GITHUB_ENV"

          echo
          echo "Artifact"
          echo "--------"
          echo "Repository: ${IMAGE_NAME}"
          echo "Tag:        ${IMAGE_TAG}"
          echo "Digest:     ${{ steps.docker-build.outputs.digest }}"
          echo
          echo "Git commit: ${GITHUB_SHA}"
          echo "GitHub run: ${GITHUB_RUN_ID}"

      # ========================================================
      # 11. HARNESS SBOM GENERATION + ATTESTATION
      #
      # - pulls our image
      # - resolves SHA256
      # - runs Syft
      # - creates SPDX JSON SBOM
      # - uploads SBOM to Harness SCS
      # - signs SBOM attestation using Vault
      # - pushes .att to registry
      #
      # KMS_KEY = name of our Vault Transit key
      # ========================================================
      - name: Generate and attest SBOM in Harness
        uses: harness/github-actions/sbom-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io

          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}

          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          TOOL: Syft
          FORMAT: spdx-json

          ATTEST: true
          KMS_KEY: cosign

      # ========================================================
      # 12. HARNESS SLSA PROVENANCE + ATTESTATION
      #
      # KEEP AFTER SBOM.
      #
      # Do not run SLSA + SBOM attestation in parallel.
      # ========================================================
      - name: Generate and attest SLSA provenance in Harness
        uses: harness/github-actions/slsa-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io

          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}

          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          ATTEST: true
          KMS_KEY: cosign

      # ========================================================
      # 13. DISPLAY CHAIN OF CUSTODY INFORMATION
      # ========================================================
      - name: Display build evidence
        run: |
          echo "=================================================="
          echo "BUILD COMPLETE"
          echo "=================================================="
          echo
          echo "GitHub Repository : ${GITHUB_REPOSITORY}"
          echo "Git Commit        : ${GITHUB_SHA}"
          echo "GitHub Run        : ${GITHUB_RUN_ID}"
          echo
          echo "Container         : ${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Digest            : ${IMAGE_DIGEST}"
          echo "Immutable Artifact: ${IMAGE_DIGEST_REF}"
          echo
          echo "SBOM              : Generated + uploaded to Harness"
          echo "SBOM Attestation  : Signed"
          echo "SLSA Provenance   : Generated + uploaded to Harness"
          echo "SLSA Attestation  : Signed"
          echo
          echo "=================================================="
