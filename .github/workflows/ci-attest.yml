name: GitHub CI to Harness SCS + CD

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-attest-deploy:
    name: Test, Build, Attest and Trigger Harness CD
    runs-on: ubuntu-latest

    env:
      # --------------------------------------------------------
      # IMAGE
      # --------------------------------------------------------
      IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/demo-banking-api
      IMAGE_TAG: ${{ github.sha }}

      # --------------------------------------------------------
      # DOCKER
      #
      # Harness SCS actions run inside Docker containers and
      # use these credentials to pull/push registry content.
      # --------------------------------------------------------
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      # --------------------------------------------------------
      # PERSISTENT HCP VAULT
      #
      # Do NOT put VAULT_ADDR under "with:" on the Harness
      # actions. The plugin receives these as environment vars.
      # --------------------------------------------------------
      VAULT_ADDR: ${{ vars.VAULT_URL }}
      VAULT_NAMESPACE: ${{ vars.VAULT_NAMESPACE }}

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v6

      # ========================================================
      # 2. PYTHON
      # ========================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ========================================================
      # 3. DEPENDENCIES
      # ========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # ========================================================
      # 4. TESTS
      # ========================================================
      - name: Run tests
        run: |
          python -m pytest -q

      # ========================================================
      # 5. AUTHENTICATE TO PERSISTENT HCP VAULT
      #
      # Generates a short-lived VAULT_TOKEN for subsequent
      # steps.
      # ========================================================
      - name: Authenticate to HCP Vault
        id: vault_login
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_URL }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportToken: true

      # ========================================================
      # 6. VERIFY COSIGN KEY ACCESS
      #
      # Persistent key:
      # transit/keys/cosign
      # type: ecdsa-p256
      # ========================================================
      - name: Verify Vault Cosign key
        run: |
          curl --fail \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            --header "X-Vault-Namespace: ${VAULT_NAMESPACE}" \
            "${VAULT_ADDR}/v1/transit/keys/cosign" \
            >/dev/null

          echo "Persistent Vault Cosign key accessible"

      # ========================================================
      # 7. DOCKER LOGIN
      # ========================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ========================================================
      # 8. BUILDX
      # ========================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # 9. BUILD + PUSH
      #
      # IMPORTANT FIX:
      #
      # - Build one platform only.
      # - Disable Docker Buildx provenance.
      # - Disable Docker Buildx SBOM.
      #
      # Harness is generating the authoritative SBOM + SLSA
      # attestations for this demo.
      #
      # This avoids the OCI-index/platform-manifest digest split
      # we saw previously.
      # ========================================================
      - name: Build and push image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          platforms: linux/amd64

          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          provenance: false
          sbom: false

      # ========================================================
      # 10. CAPTURE IMMUTABLE DIGEST
      #
      # This digest is passed into Harness CD.
      # ========================================================
      - name: Record artifact identity
        run: |
          IMAGE_DIGEST="${{ steps.docker_build.outputs.digest }}"
          IMAGE_DIGEST_REF="${IMAGE_NAME}@${IMAGE_DIGEST}"

          echo "IMAGE_DIGEST=${IMAGE_DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST_REF=${IMAGE_DIGEST_REF}" >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo "ARTIFACT CREATED"
          echo "=============================================="
          echo "Image : ${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Digest: ${IMAGE_DIGEST}"
          echo "Ref   : ${IMAGE_DIGEST_REF}"
          echo "Commit: ${GITHUB_SHA}"
          echo "=============================================="

      # ========================================================
      # 11. HARNESS SBOM GENERATION + ATTESTATION
      #
      # Generates SBOM
      # Uploads SBOM into Harness SCS
      # Signs SBOM using HCP Vault transit/keys/cosign
      # Pushes signed attestation to Docker Hub
      #
      # VAULT_ADDR / VAULT_TOKEN / VAULT_NAMESPACE arrive
      # through environment variables.
      # ========================================================
      - name: Generate and attest SBOM in Harness
        uses: harness/github-actions/sbom-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io

          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}

          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          TOOL: Syft
          FORMAT: spdx-json

          ATTEST: true
          KMS_KEY: cosign

      # ========================================================
      # 12. HARNESS SLSA PROVENANCE + ATTESTATION
      #
      # KEEP AFTER SBOM.
      #
      # Generates provenance
      # Uploads provenance into Harness SCS
      # Signs provenance using same persistent key
      # Pushes SLSA attestation to Docker Hub
      # ========================================================
      - name: Generate and attest SLSA provenance in Harness
        uses: harness/github-actions/slsa-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io

          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}

          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          ATTEST: true
          KMS_KEY: cosign

      # ========================================================
      # 13. DISPLAY CHAIN OF CUSTODY
      # ========================================================
      - name: Display chain of custody
        run: |
          echo
          echo "=================================================="
          echo "CI + SUPPLY CHAIN COMPLETE"
          echo "=================================================="
          echo
          echo "Repository        : ${GITHUB_REPOSITORY}"
          echo "Git Commit        : ${GITHUB_SHA}"
          echo "GitHub Run ID     : ${GITHUB_RUN_ID}"
          echo
          echo "Container         : ${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Digest            : ${IMAGE_DIGEST}"
          echo "Immutable Artifact: ${IMAGE_DIGEST_REF}"
          echo
          echo "Tests             : PASSED"
          echo "SBOM              : GENERATED"
          echo "SBOM Attestation  : SIGNED"
          echo "SLSA Provenance   : GENERATED"
          echo "SLSA Attestation  : SIGNED"
          echo
          echo "Vault             : Persistent HCP Vault"
          echo "Signing Key       : transit/keys/cosign"
          echo
          echo "=================================================="

      # ========================================================
      # 14. TRIGGER HARNESS CD
      #
      # Only executes after:
      #
      # tests
      # build
      # push
      # SBOM generation
      # SBOM signing
      # SLSA generation
      # SLSA signing
      #
      # have all succeeded.
      # ========================================================
      - name: Trigger Harness CD
        env:
          HARNESS_CD_WEBHOOK_URL: ${{ secrets.HARNESS_CD_WEBHOOK_URL }}
        run: |
          PAYLOAD=$(jq -n \
            --arg image "${IMAGE_NAME}" \
            --arg tag "${IMAGE_TAG}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg imageDigestRef "${IMAGE_DIGEST_REF}" \
            --arg commit "${GITHUB_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg runNumber "${GITHUB_RUN_NUMBER}" \
            --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              image: $image,
              tag: $tag,
              digest: $digest,
              imageDigestRef: $imageDigestRef,
              commit: $commit,
              repository: $repository,
              workflow: $workflow,
              githubRunId: $runId,
              githubRunNumber: $runNumber,
              githubRunUrl: $runUrl,
              ciStatus: "PASSED",
              sbomAttested: true,
              slsaAttested: true
            }')

          echo "Triggering Harness CD"
          echo "Artifact: ${IMAGE_DIGEST_REF}"

          curl --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --url "${HARNESS_CD_WEBHOOK_URL}" \
            --data "${PAYLOAD}"

          echo "Harness CD successfully triggered"
