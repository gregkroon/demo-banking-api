name: GitHub CI to Harness SCS + CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-attest-deploy:
    name: Test Build Attest Deploy
    runs-on: ubuntu-latest

    # ========================================================
    # LOCAL HASHICORP VAULT
    #
    # Ephemeral Vault OSS instance used only for this workflow.
    # No HCP Vault subscription required.
    # ========================================================
    services:
      vault:
        image: hashicorp/vault:latest
        env:
          VAULT_DEV_ROOT_TOKEN_ID: demo-root-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK

    env:
      # ========================================================
      # ARTIFACT
      # ========================================================
      IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/demo-banking-api
      IMAGE_TAG: ${{ github.sha }}

      # ========================================================
      # DOCKER HUB
      # ========================================================
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      # ========================================================
      # LOCAL VAULT
      #
      # Container actions can reach the Vault service by
      # service name.
      #
      # Shell steps running directly on the GitHub runner use
      # localhost via the exposed port.
      # ========================================================
      VAULT_ADDR: http://vault:8200
      VAULT_HOST_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: demo-root-token

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ========================================================
      # 2. SET UP PYTHON
      # ========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ========================================================
      # 3. INSTALL DEPENDENCIES
      # ========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # ========================================================
      # 4. RUN TESTS
      #
      # HARD CI GATE
      #
      # If tests fail:
      # - image is not built
      # - SBOM is not generated
      # - SLSA is not generated
      # - Harness CD is not triggered
      # ========================================================
      - name: Run tests
        run: |
          mkdir -p evidence

          python -m pytest \
            -q \
            --junitxml=evidence/pytest.xml

      # ========================================================
      # 5. UPLOAD TEST REPORT
      # ========================================================
      - name: Upload test report
        id: test_report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: evidence/pytest.xml
          if-no-files-found: error

      # ========================================================
      # 6. RECORD TEST RESULTS
      # ========================================================
      - name: Record test results
        run: |
          python <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = "evidence/pytest.xml"

          tree = ET.parse(report)
          root = tree.getroot()

          def as_int(value):
              try:
                  return int(value or 0)
              except (TypeError, ValueError):
                  return 0

          if root.tag.endswith("testsuite"):
              suites = [root]
          else:
              suites = root.findall(".//testsuite")

          total = sum(
              as_int(s.attrib.get("tests"))
              for s in suites
          )

          failures = sum(
              as_int(s.attrib.get("failures"))
              for s in suites
          )

          errors = sum(
              as_int(s.attrib.get("errors"))
              for s in suites
          )

          skipped = sum(
              as_int(s.attrib.get("skipped"))
              for s in suites
          )

          passed = max(
              total - failures - errors - skipped,
              0
          )

          if total < 1:
              raise SystemExit(
                  "ERROR: no tests were recorded"
              )

          if failures != 0 or errors != 0:
              raise SystemExit(
                  "ERROR: test report contains failures/errors"
              )

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"TEST_TOTAL={total}\n")
              f.write(f"TEST_PASSED={passed}\n")
              f.write(f"TEST_FAILURES={failures}\n")
              f.write(f"TEST_ERRORS={errors}\n")
              f.write(f"TEST_SKIPPED={skipped}\n")

          print(f"Tests total   : {total}")
          print(f"Tests passed  : {passed}")
          print(f"Failures      : {failures}")
          print(f"Errors        : {errors}")
          print(f"Skipped       : {skipped}")
          PY

      # ========================================================
      # 7. WAIT FOR LOCAL VAULT
      # ========================================================
      - name: Wait for local Vault
        run: |
          echo "Waiting for Vault..."

          for i in {1..30}; do

            if curl --silent --fail \
              "${VAULT_HOST_ADDR}/v1/sys/health" \
              >/dev/null; then

              echo "Vault is ready"
              exit 0
            fi

            echo "Vault not ready yet..."
            sleep 2
          done

          echo "ERROR: Vault did not become ready"
          exit 1

      # ========================================================
      # 8. ENABLE VAULT TRANSIT + CREATE COSIGN KEY
      #
      # Harness uses this key for SBOM/SLSA attestation.
      # ========================================================
      - name: Configure Vault signing key
        run: |
          echo "Enabling Vault Transit secrets engine..."

          curl --fail-with-body \
            --request POST \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"type":"transit"}' \
            "${VAULT_HOST_ADDR}/v1/sys/mounts/transit"

          echo
          echo "Creating Cosign signing key..."

          curl --fail-with-body \
            --request POST \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"type":"ecdsa-p256"}' \
            "${VAULT_HOST_ADDR}/v1/transit/keys/cosign"

          echo
          echo "Vault Transit key created"

      # ========================================================
      # 9. VERIFY COSIGN KEY
      # ========================================================
      - name: Verify Vault Cosign key
        run: |
          RESPONSE=$(curl --silent --fail \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_HOST_ADDR}/v1/transit/keys/cosign")

          echo "${RESPONSE}" | jq .

          KEY_TYPE=$(echo "${RESPONSE}" | jq -r '.data.type')

          if [ "${KEY_TYPE}" != "ecdsa-p256" ]; then
            echo "ERROR: expected ecdsa-p256 key"
            echo "Actual key type: ${KEY_TYPE}"
            exit 1
          fi

          echo
          echo "=============================================="
          echo "VAULT SIGNING KEY READY"
          echo "=============================================="
          echo "Engine : transit"
          echo "Key    : cosign"
          echo "Type   : ${KEY_TYPE}"
          echo "=============================================="

      # ========================================================
      # 10. LOGIN TO DOCKER HUB
      # ========================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ========================================================
      # 11. SET UP BUILDX
      # ========================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # 12. BUILD + PUSH IMAGE
      #
      # Harness generates the SBOM and provenance separately.
      # ========================================================
      - name: Build and push image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          provenance: false
          sbom: false

      # ========================================================
      # 13. RECORD IMMUTABLE ARTIFACT IDENTITY
      # ========================================================
      - name: Record artifact identity
        run: |
          IMAGE_DIGEST="${{ steps.docker_build.outputs.digest }}"
          IMAGE_DIGEST_REF="${IMAGE_NAME}@${IMAGE_DIGEST}"

          echo "IMAGE_DIGEST=${IMAGE_DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST_REF=${IMAGE_DIGEST_REF}" >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo "ARTIFACT CREATED"
          echo "=============================================="
          echo "Image  : ${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Digest : ${IMAGE_DIGEST}"
          echo "Ref    : ${IMAGE_DIGEST_REF}"
          echo "=============================================="

      # ========================================================
      # 14. HARNESS SBOM GENERATION + ATTESTATION
      #
      # Harness:
      # - scans image
      # - generates SPDX SBOM
      # - signs using Vault transit/keys/cosign
      # - uploads SBOM to Harness SCS
      # ========================================================
      - name: Generate and attest SBOM in Harness
        uses: harness/github-actions/sbom-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          TOOL: Syft
          FORMAT: spdx-json

          ATTEST: true
          KMS_KEY: cosign

      # ========================================================
      # 15. HARNESS SLSA PROVENANCE + ATTESTATION
      # ========================================================
      - name: Generate and attest SLSA provenance in Harness
        uses: harness/github-actions/slsa-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          ATTEST: true
          KMS_KEY: cosign

      # ========================================================
      # 16. DISPLAY CI CHAIN OF CUSTODY
      # ========================================================
      - name: Display chain of custody
        run: |
          echo
          echo "=================================================="
          echo "CI SUPPLY CHAIN COMPLETE"
          echo "=================================================="
          echo
          echo "Repository           : ${GITHUB_REPOSITORY}"
          echo "Commit               : ${GITHUB_SHA}"
          echo "GitHub Run ID        : ${GITHUB_RUN_ID}"
          echo "GitHub Run URL       : https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo
          echo "Artifact             : ${IMAGE_DIGEST_REF}"
          echo
          echo "Tests Total          : ${TEST_TOTAL}"
          echo "Tests Passed         : ${TEST_PASSED}"
          echo "Tests Failed         : ${TEST_FAILURES}"
          echo "Tests Errors         : ${TEST_ERRORS}"
          echo "Tests Skipped        : ${TEST_SKIPPED}"
          echo
          echo "Test Artifact ID     : ${{ steps.test_report.outputs.artifact-id }}"
          echo "Test Artifact Digest : ${{ steps.test_report.outputs.artifact-digest }}"
          echo
          echo "CI Status            : PASSED"
          echo "SBOM Attested        : YES"
          echo "SLSA Attested        : YES"
          echo
          echo "Signing Provider     : HashiCorp Vault OSS"
          echo "Signing Key          : transit/keys/cosign"
          echo "Vault Lifetime       : GitHub workflow only"
          echo
          echo "=================================================="

      # ========================================================
      # 17. TRIGGER HARNESS CD
      #
      # Reuse the same HARNESS_API_KEY that successfully
      # authenticated the Harness SCS actions above.
      #
      # Payload contains:
      #
      # ARTIFACT
      # - image
      # - tag
      # - immutable digest
      #
      # SOURCE
      # - repository
      # - commit
      # - GitHub run
      #
      # TEST EVIDENCE
      # - test counts
      # - GitHub artifact
      #
      # SUPPLY CHAIN
      # - SBOM attestation
      # - SLSA attestation
      # ========================================================
      - name: Trigger Harness CD
        env:
          HARNESS_CD_WEBHOOK_URL: ${{ secrets.HARNESS_CD_WEBHOOK_URL }}
          HARNESS_CD_API_KEY: ${{ secrets.HARNESS_API_KEY }}

        run: |
          PAYLOAD=$(jq -n \
            --arg image "${IMAGE_NAME}" \
            --arg tag "${IMAGE_TAG}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg imageDigestRef "${IMAGE_DIGEST_REF}" \
            --arg commit "${GITHUB_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg runNumber "${GITHUB_RUN_NUMBER}" \
            --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg testReportArtifactId "${{ steps.test_report.outputs.artifact-id }}" \
            --arg testReportUrl "${{ steps.test_report.outputs.artifact-url }}" \
            --arg testReportDigest "${{ steps.test_report.outputs.artifact-digest }}" \
            --argjson testTotal "${TEST_TOTAL}" \
            --argjson testPassed "${TEST_PASSED}" \
            --argjson testFailures "${TEST_FAILURES}" \
            --argjson testErrors "${TEST_ERRORS}" \
            --argjson testSkipped "${TEST_SKIPPED}" \
            '{
              image: $image,
              tag: $tag,
              digest: $digest,
              imageDigestRef: $imageDigestRef,

              commit: $commit,
              repository: $repository,
              workflow: $workflow,

              githubRunId: $runId,
              githubRunNumber: $runNumber,
              githubRunUrl: $runUrl,

              ciStatus: "PASSED",

              testsTotal: $testTotal,
              testsPassed: $testPassed,
              testsFailures: $testFailures,
              testsErrors: $testErrors,
              testsSkipped: $testSkipped,

              testReportArtifactId: $testReportArtifactId,
              testReportUrl: $testReportUrl,
              testReportDigest: $testReportDigest,

              sbomAttested: true,
              slsaAttested: true
            }')

          echo
          echo "=============================================="
          echo "TRIGGERING HARNESS CD"
          echo "=============================================="
          echo
          echo "Artifact : ${IMAGE_DIGEST_REF}"
          echo "Tests    : ${TEST_PASSED}/${TEST_TOTAL} passed"
          echo
          echo "Test Artifact ID:"
          echo "${{ steps.test_report.outputs.artifact-id }}"
          echo
          echo "Test Artifact Digest:"
          echo "${{ steps.test_report.outputs.artifact-digest }}"
          echo
          echo "Webhook payload:"
          echo "${PAYLOAD}" | jq .

          curl --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Api-Key: ${HARNESS_CD_API_KEY}" \
            --url "${HARNESS_CD_WEBHOOK_URL}" \
            --data "${PAYLOAD}"

          echo
          echo "Harness CD successfully triggered"
