name: GitHub CI to Harness SCS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-attest:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/demo-banking-api
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Docker login
      # ------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ------------------------------------------------------
      # Build
      # Assumes Dockerfile exists in repo root
      # ------------------------------------------------------
      - name: Build image
        run: |
          docker build \
            -t $IMAGE_NAME:$IMAGE_TAG \
            .

      # ------------------------------------------------------
      # Push
      # ------------------------------------------------------
      - name: Push image
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG

      # ------------------------------------------------------
      # Harness SBOM
      #
      # First run: ATTEST false.
      # Prove Harness ingestion works before adding Vault signing.
      # ------------------------------------------------------
      - name: Generate SBOM in Harness
        uses: harness/github-actions/sbom-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          TOOL: Syft
          FORMAT: spdx-json
          ATTEST: false

      # ------------------------------------------------------
      # Harness SLSA provenance
      # ------------------------------------------------------
      - name: Generate SLSA provenance in Harness
        uses: harness/github-actions/slsa-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          ATTEST: false
