name: GitHub CI to Harness SCS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-attest:
    name: Build, Test, SBOM and SLSA
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/demo-banking-api
      IMAGE_TAG: ${{ github.sha }}

      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      VAULT_ADDR: ${{ vars.VAULT_URL }}
      VAULT_NAMESPACE: ${{ vars.VAULT_NAMESPACE }}

    steps:

      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # Python
      # -------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # -------------------------------------------------------
      # Dependencies
      # -------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # -------------------------------------------------------
      # Tests
      # -------------------------------------------------------
      - name: Run tests
        run: |
          python -m pytest -q

      # -------------------------------------------------------
      # Authenticate to persistent HCP Vault
      #
      # This generates a short-lived VAULT_TOKEN.
      # -------------------------------------------------------
      - name: Authenticate to HCP Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_URL }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportToken: true

      # -------------------------------------------------------
      # Verify Vault access to persistent Cosign key
      # -------------------------------------------------------
      - name: Verify Vault signing key access
        run: |
          curl --fail \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            --header "X-Vault-Namespace: ${VAULT_NAMESPACE}" \
            "${VAULT_ADDR}/v1/transit/keys/cosign" \
            >/dev/null

          echo "Persistent Cosign signing key accessible"

      # -------------------------------------------------------
      # Docker login
      # -------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------------------------------------------------------
      # Buildx
      # -------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------------
      # Build + push
      # -------------------------------------------------------
      - name: Build and push image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # -------------------------------------------------------
      # Record immutable artifact digest
      # -------------------------------------------------------
      - name: Record artifact identity
        run: |
          echo "IMAGE_DIGEST=${{ steps.docker_build.outputs.digest }}" \
            >> "$GITHUB_ENV"

          echo "IMAGE_DIGEST_REF=${IMAGE_NAME}@${{ steps.docker_build.outputs.digest }}" \
            >> "$GITHUB_ENV"

          echo "Image:  ${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Digest: ${{ steps.docker_build.outputs.digest }}"

      # -------------------------------------------------------
      # Harness SBOM + signed attestation
      # -------------------------------------------------------
      - name: Generate and attest SBOM in Harness
        uses: harness/github-actions/sbom-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io

          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}

          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          VAULT_ADDR: ${{ vars.VAULT_URL }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          TOOL: Syft
          FORMAT: spdx-json

          ATTEST: true
          KMS_KEY: cosign

      # -------------------------------------------------------
      # Harness SLSA + signed provenance
      #
      # Keep sequential after SBOM.
      # -------------------------------------------------------
      - name: Generate and attest SLSA provenance in Harness
        uses: harness/github-actions/slsa-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io

          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}

          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          VAULT_ADDR: ${{ vars.VAULT_URL }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          ATTEST: true
          KMS_KEY: cosign

      # -------------------------------------------------------
      # Display evidence
      # -------------------------------------------------------
      - name: Display chain of custody
        run: |
          echo "=================================================="
          echo "BUILD + SUPPLY CHAIN EVIDENCE COMPLETE"
          echo "=================================================="
          echo
          echo "Repository        : ${GITHUB_REPOSITORY}"
          echo "Git Commit        : ${GITHUB_SHA}"
          echo "GitHub Run ID     : ${GITHUB_RUN_ID}"
          echo
          echo "Container         : ${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Digest            : ${IMAGE_DIGEST}"
          echo "Immutable Artifact: ${IMAGE_DIGEST_REF}"
          echo
          echo "Tests             : PASSED"
          echo "SBOM              : GENERATED"
          echo "SBOM Attestation  : SIGNED"
          echo "SLSA Provenance   : GENERATED"
          echo "SLSA Attestation  : SIGNED"
          echo
          echo "Vault             : PERSISTENT HCP VAULT"
          echo "Signing Key       : transit/keys/cosign"
          echo
          echo "=================================================="
