jobs:
  build-attest:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/my-app
      IMAGE_TAG: ${{ github.sha }}

    steps:
      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Run tests
      # Replace with your actual tests
      # -------------------------------------------------------
      - name: Run tests
        run: |
          npm ci
          npm test

      # -------------------------------------------------------
      # Login to Docker registry
      # -------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------------------------------------------------------
      # Build + push artifact
      # -------------------------------------------------------
      - name: Build and push image
        run: |
          docker build \
            -t $IMAGE_NAME:$IMAGE_TAG \
            .

          docker push $IMAGE_NAME:$IMAGE_TAG

      # -------------------------------------------------------
      # Login to Vault
      # -------------------------------------------------------
      - name: Login to Vault
        uses: hashicorp/vault-action@v3
        id: vault
        with:
          url: ${{ secrets.VAULT_URL }}
          method: token
          token: ${{ secrets.VAULT_TOKEN }}

      # -------------------------------------------------------
      # Make Vault credentials available to Harness Docker Actions
      # -------------------------------------------------------
      - name: Configure Vault environment
        run: |
          echo "VAULT_ADDR=${{ secrets.VAULT_URL }}" >> $GITHUB_ENV
          echo "VAULT_TOKEN=${{ secrets.VAULT_TOKEN }}" >> $GITHUB_ENV

      # -------------------------------------------------------
      # Generate SBOM + SIGN ATTESTATION
      # -------------------------------------------------------
      - name: Generate and attest SBOM
        uses: harness/github-actions/sbom-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io
          HARNESS_ACCOUNT_ID: ${{ secrets.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ secrets.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ secrets.HARNESS_PROJECT_ID }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          TOOL: Syft
          FORMAT: spdx-json

          ATTEST: true

          # Path/name of Cosign private key in Vault
          KMS_KEY: cosign

      # -------------------------------------------------------
      # Generate SLSA provenance + SIGN ATTESTATION
      #
      # Keep AFTER SBOM — don't run concurrently.
      # -------------------------------------------------------
      - name: Generate and attest SLSA provenance
        uses: harness/github-actions/slsa-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io
          HARNESS_ACCOUNT_ID: ${{ secrets.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ secrets.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ secrets.HARNESS_PROJECT_ID }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          ATTEST: true

          # Same signing key
          KMS_KEY: cosign
