name: GitHub CI to Harness SCS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-attest:
    name: Build, Test, SBOM and SLSA
    runs-on: ubuntu-latest

    # ----------------------------------------------------------
    # Disposable Vault for this POC
    # ----------------------------------------------------------
    services:
      vault:
        image: hashicorp/vault:1.21
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK

    env:
      IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/demo-banking-api
      IMAGE_TAG: ${{ github.sha }}

      # Harness SCS action expects these for Docker registry access.
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      # Disposable Vault uses root token for this POC.
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v6

      # ========================================================
      # 2. PYTHON
      # ========================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ========================================================
      # 3. INSTALL DEPENDENCIES
      #
      # pytest is explicitly installed because it is not currently
      # present in requirements.txt.
      # ========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # ========================================================
      # 4. TEST
      # ========================================================
      - name: Run tests
        run: |
          python -m pytest -q

      # ========================================================
      # 5. WAIT FOR VAULT
      #
      # Runner shell talks to Vault through localhost because
      # port 8200 is mapped to the GitHub runner.
      # ========================================================
      - name: Wait for Vault
        env:
          LOCAL_VAULT_ADDR: http://127.0.0.1:8200
        run: |
          echo "Waiting for Vault..."

          for i in {1..30}; do
            if curl --silent \
              --output /dev/null \
              "${LOCAL_VAULT_ADDR}/v1/sys/health"; then
              echo "Vault is ready"
              exit 0
            fi

            sleep 2
          done

          echo "Vault failed to start"
          exit 1

      # ========================================================
      # 6. ENABLE VAULT TRANSIT ENGINE
      # ========================================================
      - name: Enable Vault Transit engine
        env:
          LOCAL_VAULT_ADDR: http://127.0.0.1:8200
        run: |
          HTTP_CODE=$(curl \
            --silent \
            --output /tmp/vault-transit-response \
            --write-out "%{http_code}" \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            --header "Content-Type: application/json" \
            --request POST \
            --data '{"type":"transit"}' \
            "${LOCAL_VAULT_ADDR}/v1/sys/mounts/transit")

          # 204 = created successfully
          # 400 may mean it already exists
          if [ "$HTTP_CODE" != "204" ] && [ "$HTTP_CODE" != "400" ]; then
            cat /tmp/vault-transit-response
            exit 1
          fi

          echo "Vault Transit engine ready"

      # ========================================================
      # 7. CREATE ECDSA P-256 COSIGN KEY
      #
      # Harness documents Transit + ecdsa-p256 for Cosign.
      # Key name: cosign
      # ========================================================
      - name: Create Cosign signing key
        env:
          LOCAL_VAULT_ADDR: http://127.0.0.1:8200
        run: |
          curl --fail \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            --header "Content-Type: application/json" \
            --request POST \
            --data '{"type":"ecdsa-p256"}' \
            "${LOCAL_VAULT_ADDR}/v1/transit/keys/cosign"

          echo "Cosign key created: transit/keys/cosign"

      # ========================================================
      # 8. VERIFY COSIGN KEY
      # ========================================================
      - name: Verify Cosign signing key
        env:
          LOCAL_VAULT_ADDR: http://127.0.0.1:8200
        run: |
          curl --fail \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            "${LOCAL_VAULT_ADDR}/v1/transit/keys/cosign" \
            >/dev/null

          echo "Vault Cosign key verified"

      # ========================================================
      # 9. DETERMINE VAULT ADDRESS FOR DOCKER ACTIONS
      #
      # Harness GitHub Actions execute inside Docker containers.
      #
      # Vault port 8200 is exposed on the runner host.
      # A Docker action reaches the host through the Docker
      # bridge gateway.
      # ========================================================
      - name: Configure Vault address for Harness Actions
        id: vault_address
        run: |
          DOCKER_GATEWAY=$(docker network inspect bridge \
            --format '{{(index .IPAM.Config 0).Gateway}}')

          VAULT_URL="http://${DOCKER_GATEWAY}:8200"

          echo "url=${VAULT_URL}" >> "$GITHUB_OUTPUT"
          echo "VAULT_ADDR=${VAULT_URL}" >> "$GITHUB_ENV"

          echo "Harness actions will use Vault at ${VAULT_URL}"

      # ========================================================
      # 10. DOCKER LOGIN
      # ========================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ========================================================
      # 11. SET UP BUILDX
      # ========================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # 12. BUILD + PUSH
      # ========================================================
      - name: Build and push image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # ========================================================
      # 13. CAPTURE IMMUTABLE DIGEST
      # ========================================================
      - name: Record artifact identity
        run: |
          echo "IMAGE_DIGEST=${{ steps.docker_build.outputs.digest }}" \
            >> "$GITHUB_ENV"

          echo "IMAGE_DIGEST_REF=${IMAGE_NAME}@${{ steps.docker_build.outputs.digest }}" \
            >> "$GITHUB_ENV"

          echo "Image:  ${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Digest: ${{ steps.docker_build.outputs.digest }}"

      # ========================================================
      # 14. HARNESS SBOM + ATTESTATION
      #
      # Harness:
      # - resolves the container
      # - generates SBOM using Syft
      # - uploads SBOM to SCS
      # - signs SBOM attestation with Vault key
      # - pushes attestation to registry
      # ========================================================
      - name: Generate and attest SBOM in Harness
        uses: harness/github-actions/sbom-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          VAULT_ADDR: ${{ steps.vault_address.outputs.url }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          TOOL: Syft
          FORMAT: spdx-json

          ATTEST: true
          KMS_KEY: cosign

      # ========================================================
      # 15. HARNESS SLSA + ATTESTATION
      #
      # Keep this AFTER SBOM.
      # ========================================================
      - name: Generate and attest SLSA provenance in Harness
        uses: harness/github-actions/slsa-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          VAULT_ADDR: ${{ steps.vault_address.outputs.url }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          ATTEST: true
          KMS_KEY: cosign

      # ========================================================
      # 16. FINAL EVIDENCE
      # ========================================================
      - name: Display chain of custody
        run: |
          echo "=================================================="
          echo "BUILD + SUPPLY CHAIN EVIDENCE COMPLETE"
          echo "=================================================="
          echo
          echo "Repository        : ${GITHUB_REPOSITORY}"
          echo "Git Commit        : ${GITHUB_SHA}"
          echo "GitHub Run ID     : ${GITHUB_RUN_ID}"
          echo
          echo "Container         : ${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Digest            : ${IMAGE_DIGEST}"
          echo "Immutable Artifact: ${IMAGE_DIGEST_REF}"
          echo
          echo "Tests             : PASSED"
          echo "SBOM              : GENERATED"
          echo "SBOM Attestation  : SIGNED"
          echo "SLSA Provenance   : GENERATED"
          echo "SLSA Attestation  : SIGNED"
          echo
          echo "=================================================="
