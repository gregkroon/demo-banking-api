name: GitHub CI to Harness SCS + CD

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-attest-deploy:
    name: Test, Build, Attest and Trigger Harness CD
    runs-on: ubuntu-latest

    env:
      # --------------------------------------------------------
      # Artifact
      # --------------------------------------------------------
      IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/demo-banking-api
      IMAGE_TAG: ${{ github.sha }}

      # --------------------------------------------------------
      # Docker credentials
      #
      # Harness SCS actions run inside their own Docker
      # containers, so expose these at job level.
      # --------------------------------------------------------
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      # --------------------------------------------------------
      # Persistent HCP Vault
      # --------------------------------------------------------
      VAULT_ADDR: ${{ vars.VAULT_URL }}
      VAULT_NAMESPACE: ${{ vars.VAULT_NAMESPACE }}

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v6

      # ========================================================
      # 2. SET UP PYTHON
      # ========================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ========================================================
      # 3. INSTALL DEPENDENCIES
      # ========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # ========================================================
      # 4. RUN TESTS
      #
      # If this fails, nothing after it runs.
      # ========================================================
      - name: Run tests
        run: |
          python -m pytest -q

      # ========================================================
      # 5. AUTHENTICATE TO PERSISTENT HCP VAULT
      #
      # Uses:
      #   VAULT_ROLE_ID
      #   VAULT_SECRET_ID
      #
      # Gets a short-lived Vault token.
      # ========================================================
      - name: Authenticate to HCP Vault
        id: vault_login
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_URL }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportToken: true

      # ========================================================
      # 6. VERIFY WE CAN ACCESS THE PERSISTENT COSIGN KEY
      #
      # Existing Vault key:
      #
      #   transit/keys/cosign
      #
      # type: ecdsa-p256
      # ========================================================
      - name: Verify Vault Cosign key
        run: |
          curl --fail \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            --header "X-Vault-Namespace: ${VAULT_NAMESPACE}" \
            "${VAULT_ADDR}/v1/transit/keys/cosign" \
            >/dev/null

          echo "Persistent Vault signing key is accessible"

      # ========================================================
      # 7. LOGIN TO DOCKER HUB
      # ========================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ========================================================
      # 8. SET UP DOCKER BUILDX
      # ========================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # 9. BUILD + PUSH IMAGE
      #
      # Git commit SHA becomes the tag.
      #
      # Example:
      #
      # munkys123/demo-banking-api:
      # a67e930db329...
      # ========================================================
      - name: Build and push image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # ========================================================
      # 10. CAPTURE IMMUTABLE IMAGE DIGEST
      #
      # This is the critical chain-of-custody identifier.
      # ========================================================
      - name: Record artifact identity
        run: |
          echo "IMAGE_DIGEST=${{ steps.docker_build.outputs.digest }}" \
            >> "$GITHUB_ENV"

          echo "IMAGE_DIGEST_REF=${IMAGE_NAME}@${{ steps.docker_build.outputs.digest }}" \
            >> "$GITHUB_ENV"

          echo
          echo "Artifact identity"
          echo "-----------------"
          echo "Image : ${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Digest: ${{ steps.docker_build.outputs.digest }}"
          echo "Commit: ${GITHUB_SHA}"

      # ========================================================
      # 11. HARNESS SBOM GENERATION + ATTESTATION
      #
      # Harness:
      #
      #   - Resolves artifact digest
      #   - Runs Syft
      #   - Generates SPDX SBOM
      #   - Uploads SBOM to Harness SCS
      #   - Signs SBOM using persistent Vault key
      #   - Pushes attestation to registry
      #
      # Vault key:
      #
      #   transit/keys/cosign
      # ========================================================
      - name: Generate and attest SBOM in Harness
        uses: harness/github-actions/sbom-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io

          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}

          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          VAULT_ADDR: ${{ vars.VAULT_URL }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          TOOL: Syft
          FORMAT: spdx-json

          ATTEST: true
          KMS_KEY: cosign

      # ========================================================
      # 12. HARNESS SLSA PROVENANCE + ATTESTATION
      #
      # Keep this sequentially AFTER SBOM.
      # ========================================================
      - name: Generate and attest SLSA provenance in Harness
        uses: harness/github-actions/slsa-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io

          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}

          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          VAULT_ADDR: ${{ vars.VAULT_URL }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          ATTEST: true
          KMS_KEY: cosign

      # ========================================================
      # 13. DISPLAY CHAIN OF CUSTODY
      # ========================================================
      - name: Display chain of custody
        run: |
          echo "=================================================="
          echo "CI + SUPPLY CHAIN COMPLETE"
          echo "=================================================="
          echo
          echo "Repository        : ${GITHUB_REPOSITORY}"
          echo "Git Commit        : ${GITHUB_SHA}"
          echo "GitHub Run ID     : ${GITHUB_RUN_ID}"
          echo
          echo "Container         : ${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Digest            : ${IMAGE_DIGEST}"
          echo "Immutable Artifact: ${IMAGE_DIGEST_REF}"
          echo
          echo "Tests             : PASSED"
          echo "SBOM              : GENERATED"
          echo "SBOM Attestation  : SIGNED"
          echo "SLSA Provenance   : GENERATED"
          echo "SLSA Attestation  : SIGNED"
          echo
          echo "Vault             : HCP Vault"
          echo "Signing Key       : transit/keys/cosign"
          echo
          echo "=================================================="

      # ========================================================
      # 14. TRIGGER HARNESS CD
      #
      # Only runs if EVERYTHING above succeeded.
      #
      # Sends:
      #
      #   image
      #   tag
      #   digest
      #   immutable image reference
      #   Git commit
      #   GitHub workflow/run information
      #
      # Harness can reference these as:
      #
      # <+trigger.payload.image>
      # <+trigger.payload.tag>
      # <+trigger.payload.digest>
      # <+trigger.payload.imageDigestRef>
      # <+trigger.payload.commit>
      # <+trigger.payload.githubRunId>
      # ========================================================
      - name: Trigger Harness CD
        env:
          HARNESS_CD_WEBHOOK_URL: ${{ secrets.HARNESS_CD_WEBHOOK_URL }}
        run: |
          PAYLOAD=$(jq -n \
            --arg image "${IMAGE_NAME}" \
            --arg tag "${IMAGE_TAG}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg imageDigestRef "${IMAGE_DIGEST_REF}" \
            --arg commit "${GITHUB_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg runNumber "${GITHUB_RUN_NUMBER}" \
            --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              image: $image,
              tag: $tag,
              digest: $digest,
              imageDigestRef: $imageDigestRef,
              commit: $commit,
              repository: $repository,
              workflow: $workflow,
              githubRunId: $runId,
              githubRunNumber: $runNumber,
              githubRunUrl: $runUrl,
              ciStatus: "PASSED",
              sbomAttested: true,
              slsaAttested: true
            }')

          echo "Triggering Harness CD..."

          curl --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --url "${HARNESS_CD_WEBHOOK_URL}" \
            --data "${PAYLOAD}"

          echo
          echo "Harness CD successfully triggered"
