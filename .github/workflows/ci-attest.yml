name: GitHub CI to Harness SCS + CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-attest-deploy:
    name: Test Build Attest Deploy
    runs-on: ubuntu-latest

    env:
      # --------------------------------------------------------
      # Artifact
      # --------------------------------------------------------
      IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/demo-banking-api
      IMAGE_TAG: ${{ github.sha }}

      # --------------------------------------------------------
      # Docker Hub
      # --------------------------------------------------------
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      # --------------------------------------------------------
      # HCP Vault
      # --------------------------------------------------------
      VAULT_ADDR: ${{ vars.VAULT_URL }}
      VAULT_NAMESPACE: ${{ vars.VAULT_NAMESPACE }}

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ========================================================
      # 2. PYTHON
      # ========================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ========================================================
      # 3. INSTALL DEPENDENCIES
      # ========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # ========================================================
      # 4. RUN TESTS
      #
      # If tests fail, CI stops before building or attesting.
      # JUnit output becomes the source evidence.
      # ========================================================
      - name: Run tests
        run: |
          mkdir -p evidence

          python -m pytest \
            -q \
            --junitxml=evidence/pytest.xml

      # ========================================================
      # 5. KEEP TEST REPORT IN GITHUB
      # ========================================================
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: evidence/pytest.xml
          if-no-files-found: warn

      # ========================================================
      # 6. AUTHENTICATE TO HCP VAULT
      #
      # VAULT_TOKEN is exported for Harness actions + Cosign.
      # ========================================================
      - name: Authenticate to HCP Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_URL }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportToken: true

      # ========================================================
      # 7. VERIFY VAULT KEY ACCESS
      # ========================================================
      - name: Verify Vault Cosign key
        run: |
          curl --fail \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            --header "X-Vault-Namespace: ${VAULT_NAMESPACE}" \
            "${VAULT_ADDR}/v1/transit/keys/cosign" \
            >/dev/null

          echo "Vault Cosign key accessible"

      # ========================================================
      # 8. INSTALL COSIGN
      #
      # Pin Cosign to the same version used in Harness Run step.
      # ========================================================
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Check Cosign
        run: cosign version

      # ========================================================
      # 9. DOCKER LOGIN
      # ========================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ========================================================
      # 10. SET UP BUILDX
      # ========================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================================
      # 11. BUILD + PUSH
      #
      # IMPORTANT:
      # One platform only.
      #
      # Disable Buildx-generated SBOM/provenance because Harness
      # generates the SBOM and SLSA evidence we want to verify.
      # ========================================================
      - name: Build and push image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          provenance: false
          sbom: false

      # ========================================================
      # 12. RECORD IMMUTABLE ARTIFACT IDENTITY
      # ========================================================
      - name: Record artifact identity
        run: |
          IMAGE_DIGEST="${{ steps.docker_build.outputs.digest }}"
          IMAGE_DIGEST_REF="${IMAGE_NAME}@${IMAGE_DIGEST}"

          echo "IMAGE_DIGEST=${IMAGE_DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST_REF=${IMAGE_DIGEST_REF}" >> "$GITHUB_ENV"

          echo "=============================================="
          echo "ARTIFACT CREATED"
          echo "=============================================="
          echo "Image  : ${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Digest : ${IMAGE_DIGEST}"
          echo "Ref    : ${IMAGE_DIGEST_REF}"
          echo "=============================================="

      # ========================================================
      # 13. CREATE TEST EVIDENCE
      #
      # Turn the JUnit report into a compact signed predicate.
      # The full JUnit report remains available as a GitHub
      # workflow artifact.
      # ========================================================
      - name: Create test evidence
        run: |
          python <<'PY'
          import hashlib
          import json
          import os
          import xml.etree.ElementTree as ET

          report = "evidence/pytest.xml"

          tree = ET.parse(report)
          root = tree.getroot()

          def as_int(value):
              try:
                  return int(value or 0)
              except (TypeError, ValueError):
                  return 0

          if root.tag.endswith("testsuite"):
              suites = [root]
          else:
              suites = root.findall(".//testsuite")

          total = sum(as_int(s.attrib.get("tests")) for s in suites)
          failures = sum(as_int(s.attrib.get("failures")) for s in suites)
          errors = sum(as_int(s.attrib.get("errors")) for s in suites)
          skipped = sum(as_int(s.attrib.get("skipped")) for s in suites)

          passed = max(total - failures - errors - skipped, 0)

          with open(report, "rb") as f:
              report_sha256 = hashlib.sha256(f.read()).hexdigest()

          predicate = {
              "schemaVersion": "1.0",
              "status": "PASSED",
              "framework": "pytest",

              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "workflow": os.environ["GITHUB_WORKFLOW"],

              "githubRunId": os.environ["GITHUB_RUN_ID"],
              "githubRunNumber": os.environ["GITHUB_RUN_NUMBER"],
              "githubRunUrl":
                  f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',

              "artifactDigest": os.environ["IMAGE_DIGEST"],

              "tests": {
                  "total": total,
                  "passed": passed,
                  "failures": failures,
                  "errors": errors,
                  "skipped": skipped,
                  "reportFormat": "junit",
                  "reportSha256": report_sha256
              }
          }

          if total < 1:
              raise SystemExit("ERROR: no tests were recorded")

          if failures != 0 or errors != 0:
              raise SystemExit("ERROR: test evidence contains failures/errors")

          with open("evidence/test-results.json", "w") as f:
              json.dump(predicate, f, indent=2)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"TEST_TOTAL={total}\n")
              f.write(f"TEST_PASSED={passed}\n")
              f.write(f"TEST_FAILURES={failures}\n")
              f.write(f"TEST_ERRORS={errors}\n")
              f.write(f"TEST_SKIPPED={skipped}\n")

          print(json.dumps(predicate, indent=2))
          PY

      # ========================================================
      # 14. GENERATE + ATTEST SBOM IN HARNESS
      # ========================================================
      - name: Generate and attest SBOM in Harness
        uses: harness/github-actions/sbom-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          TOOL: Syft
          FORMAT: spdx-json

          ATTEST: true
          KMS_KEY: cosign

      # ========================================================
      # 15. GENERATE + ATTEST SLSA IN HARNESS
      #
      # Keep this sequentially after SBOM.
      # ========================================================
      - name: Generate and attest SLSA provenance in Harness
        uses: harness/github-actions/slsa-generation@1.1.0
        with:
          HARNESS_ACCOUNT_URL: https://app.harness.io
          HARNESS_ACCOUNT_ID: ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG_ID: ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT_ID: ${{ vars.HARNESS_PROJECT_ID }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}

          TARGET: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          ATTEST: true
          KMS_KEY: cosign

      # ========================================================
      # 16. CREATE SIGNED TEST ATTESTATION
      #
      # IMPORTANT:
      # Use Cosign's CUSTOM predicate type.
      #
      # This becomes:
      # predicateType:
      # https://cosign.sigstore.dev/attestation/v1
      #
      # Our JSON lives inside predicate.Data.
      # ========================================================
      - name: Attest test results
        run: |
          echo "=============================================="
          echo "CREATING TEST ATTESTATION"
          echo "=============================================="
          echo "Artifact: ${IMAGE_DIGEST_REF}"

          cosign attest \
            --yes \
            --key hashivault://cosign \
            --predicate evidence/test-results.json \
            --type custom \
            "${IMAGE_DIGEST_REF}"

          echo "Test attestation created"

      # ========================================================
      # 17. VERIFY CUSTOM TEST ATTESTATION IN GITHUB
      #
      # This proves:
      # - registry contains it
      # - signature verifies with Vault key
      # - it is a custom attestation
      # ========================================================
      - name: Verify test attestation
        run: |
          echo "=============================================="
          echo "VERIFYING TEST ATTESTATION"
          echo "=============================================="

          cosign verify-attestation \
            --key hashivault://cosign \
            --type custom \
            --insecure-ignore-tlog \
            "${IMAGE_DIGEST_REF}" \
            > evidence/verified-test-attestations.json

          echo "Cryptographic test attestation verification passed"

      # ========================================================
      # 18. VALIDATE THE SIGNED TEST PREDICATE
      #
      # There may be multiple attestations on the same image.
      # Find a CUSTOM one whose signed Data matches this exact:
      # - artifact digest
      # - repository
      # - commit
      # - passing test state
      # ========================================================
      - name: Validate signed test evidence
  run: |
    echo "Creating Cosign policy for this exact build"

    cat > evidence/test-policy.rego <<EOF
    package signature

    test := json.unmarshal(input.Data)

    allow[msg] {
      test.status != "PASSED"
      msg := sprintf("Test status is not PASSED: %v", [test.status])
    }

    allow[msg] {
      test.repository != "${GITHUB_REPOSITORY}"
      msg := sprintf("Repository mismatch: %v", [test.repository])
    }

    allow[msg] {
      test.commit != "${GITHUB_SHA}"
      msg := sprintf("Commit mismatch: %v", [test.commit])
    }

    allow[msg] {
      test.artifactDigest != "${IMAGE_DIGEST}"
      msg := sprintf("Artifact digest mismatch: %v", [test.artifactDigest])
    }

    allow[msg] {
      test.tests.total <= 0
      msg := sprintf("No tests executed: %v", [test.tests.total])
    }

    allow[msg] {
      test.tests.failures != 0
      msg := sprintf("Test failures detected: %v", [test.tests.failures])
    }

    allow[msg] {
      test.tests.errors != 0
      msg := sprintf("Test errors detected: %v", [test.tests.errors])
    }
    EOF

    echo "Validating signed test attestation policy"

    cosign verify-attestation \
      --key hashivault://cosign \
      --type custom \
      --policy evidence/test-policy.rego \
      --insecure-ignore-tlog \
      "${IMAGE_DIGEST_REF}" \
      >/dev/null

    echo "=============================================="
    echo "SIGNED TEST EVIDENCE VALIDATED"
    echo "=============================================="
    echo "Artifact   : ${IMAGE_DIGEST_REF}"
    echo "Commit     : ${GITHUB_SHA}"
    echo "Repository : ${GITHUB_REPOSITORY}"
    echo "Tests      : ${TEST_PASSED}/${TEST_TOTAL} passed"
    echo "=============================================="

      # ========================================================
      # 19. DISPLAY CHAIN OF CUSTODY
      # ========================================================
      - name: Display chain of custody
        run: |
          echo
          echo "=================================================="
          echo "CI SUPPLY CHAIN COMPLETE"
          echo "=================================================="
          echo
          echo "Repository        : ${GITHUB_REPOSITORY}"
          echo "Commit            : ${GITHUB_SHA}"
          echo "GitHub Run        : ${GITHUB_RUN_ID}"
          echo
          echo "Artifact          : ${IMAGE_DIGEST_REF}"
          echo
          echo "Tests Total       : ${TEST_TOTAL}"
          echo "Tests Passed      : ${TEST_PASSED}"
          echo "Tests Failed      : ${TEST_FAILURES}"
          echo "Tests Errors      : ${TEST_ERRORS}"
          echo "Tests Skipped     : ${TEST_SKIPPED}"
          echo
          echo "SBOM Attested     : YES"
          echo "SLSA Attested     : YES"
          echo "Tests Attested    : YES"
          echo
          echo "Signing Key       : HCP Vault transit/keys/cosign"
          echo
          echo "=================================================="

      # ========================================================
      # 20. TRIGGER HARNESS CD
      #
      # Harness receives the exact immutable artifact identity
      # plus GitHub CI metadata.
      # ========================================================
      - name: Trigger Harness CD
        env:
          HARNESS_CD_WEBHOOK_URL: ${{ secrets.HARNESS_CD_WEBHOOK_URL }}
        run: |
          PAYLOAD=$(jq -n \
            --arg image "${IMAGE_NAME}" \
            --arg tag "${IMAGE_TAG}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg imageDigestRef "${IMAGE_DIGEST_REF}" \
            --arg commit "${GITHUB_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg runNumber "${GITHUB_RUN_NUMBER}" \
            --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --argjson testTotal "${TEST_TOTAL}" \
            --argjson testPassed "${TEST_PASSED}" \
            '{
              image: $image,
              tag: $tag,
              digest: $digest,
              imageDigestRef: $imageDigestRef,

              commit: $commit,
              repository: $repository,
              workflow: $workflow,

              githubRunId: $runId,
              githubRunNumber: $runNumber,
              githubRunUrl: $runUrl,

              ciStatus: "PASSED",

              sbomAttested: true,
              slsaAttested: true,
              testsAttested: true,

              testsTotal: $testTotal,
              testsPassed: $testPassed
            }')

          echo "Triggering Harness CD for:"
          echo "${IMAGE_DIGEST_REF}"

          curl --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --url "${HARNESS_CD_WEBHOOK_URL}" \
            --data "${PAYLOAD}"

          echo "Harness CD successfully triggered"
